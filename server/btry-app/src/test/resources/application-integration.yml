spring:
  datasource:
    url: ${IT_DB_URL}
    username: ${IT_DB_USER:btry}
    password: ${IT_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 24
      minimum-idle: 4
      connection-timeout: 10000
  data:
    redis:
      host: ${IT_REDIS_HOST:127.0.0.1}
      port: ${IT_REDIS_PORT:16379}
      password: ${IT_REDIS_PASSWORD:}
      database: ${IT_REDIS_DATABASE:15}
  flyway:
    enabled: true

server:
  port: 0

management:
  server:
    port: 0

app:
  tenant:
    enforce: true
    default-tenant-id: 0
  security:
    login-protection-enabled: false
  storage:
    enabled: false
  invitation:
    base-url: http://127.0.0.1:5175
    expiry-hours: 72
    max-attempts: 20
    window-minutes: 10
  payment:
    provider: mock
    mock-enabled: true
    mock-secret: integration-mock-secret
    order-expire-minutes: 15
    query-after-seconds: 0
    reconcile-batch-size: 100
    reconcile-interval-ms: 3600000
    reconcile-initial-delay-ms: 3600000
    refund-max-attempts: 5
    refund-retry-base-seconds: 5
    outbox:
      interval-ms: 3600000
      initial-delay-ms: 3600000
  recon:
    enabled: false
  alert:
    enabled: false
    initial-delay-ms: 3600000
  seed:
    admin-password: Integration1Pass

logging:
  level:
    root: warn
    com.wherelee.base: warn
